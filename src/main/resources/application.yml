spring:
  application:
    name: spring-lab

server:
  port: 8080

app:
  owner: "Kozy-Korpesh Bekzhan"
  group: IT1-2413IS
  date-pattern: "yyyy-MM-dd HH:mm:ss"
  mail:
    from: no-reply@iitu.kz
    retry-count: 3
    timeout: 5s
    enabled: true
  locale:
    default-locale: ru
    supported:
      - ru
      - kk
      - en
logging:
  level:
    web: INFO
    kz.iitu: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,env,configprops,conditions
